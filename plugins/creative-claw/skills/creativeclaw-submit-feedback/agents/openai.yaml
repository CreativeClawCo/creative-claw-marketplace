interface:
  display_name: "Creative Claw — Submit Feedback"
  short_description: "Report product and quality feedback to the team"
  default_prompt: "Use $creativeclaw-submit-feedback to send my feedback about this issue or request to the Creative Claw team."
dependencies:
  tools:
    - type: "mcp"
      value: "creative-claw"
      description: "Creative Claw media, asset, Character, Film, and feedback tools"
      transport: "streamable_http"
      url: "https://app.creativeclaw.co/mcp/chatgpt"
policy:
  allow_implicit_invocation: true

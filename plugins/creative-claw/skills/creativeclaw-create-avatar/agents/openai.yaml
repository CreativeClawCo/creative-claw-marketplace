interface:
  display_name: "Creative Claw Create Your Avatar"
  short_description: "Create and save a consistent personal avatar"
  default_prompt: "Use $creativeclaw-create-avatar to turn my photos into an approved character sheet and save my reusable avatar."
dependencies:
  tools:
    - type: "mcp"
      value: "creative-claw"
      description: "Creative Claw image, Character and voice tools"
      transport: "streamable_http"
      url: "https://app.creativeclaw.co/mcp/chatgpt"
policy:
  allow_implicit_invocation: true

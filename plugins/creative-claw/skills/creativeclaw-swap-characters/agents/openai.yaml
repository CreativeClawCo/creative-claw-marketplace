interface:
  display_name: "Creative Claw — Swap Characters"
  short_description: "Swap people in an existing video with your Characters"
  default_prompt: "Use $creativeclaw-swap-characters to put my Character into this video in place of the person on screen."
dependencies:
  tools:
    - type: "mcp"
      value: "creative-claw"
      description: "Creative Claw media, asset, Character, Film, and feedback tools"
      transport: "streamable_http"
      url: "https://app.creativeclaw.co/mcp/chatgpt"
policy:
  allow_implicit_invocation: true
